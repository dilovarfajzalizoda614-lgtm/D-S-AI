<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-S-AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 20px;
      background: #111827;
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .chat {
      padding: 20px;
      min-height: 500px;
    }

    .welcome {
      text-align: center;
      margin-top: 60px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f1f5f9;
      min-height: 50px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 D-S-AI</h1>
    <p>Ёвари зеҳни сунъӣ</p>
  </header>

  <div class="chat">

    <div class="welcome">
      <h2>Салом! 👋</h2>
      <p>Ман D-S-AI ҳастам.</p>
      <p>Саволи худро нависед.</p>
    </div>

    <textarea id="question" rows="4"
      placeholder="Саволи худро нависед..."></textarea>

    <button onclick="askAI()">Пурсидан</button>

    <div id="answer">
      Ҷавоб дар ин ҷо пайдо мешавад...
    </div>

  </div>

</div>

<script>
function askAI() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if (question === "") {
    answer.innerText = "Лутфан савол нависед.";
    return;
  }

  answer.innerText =
    "D-S-AI саволи шуморо қабул кард: " + question;
}
</script>

</body>
</html>
